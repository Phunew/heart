<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hiệu Ứng Trái Tim Hạt Tốc Độ Cao</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* Tắt hoàn toàn hiệu ứng nháy xanh khi chạm ngón tay trên điện thoại */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020104;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            touch-action: none; /* Vô hiệu hóa thao tác phóng to màn hình khi chạm đúp */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .instruction {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 140, 180, 0.45);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let heartScaleBase = 13.5;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        // Hàm tính toán và điều chỉnh kích thước responsive
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            centerX = width / 2;
            centerY = height / 2 - 20;

            // Tự động thu nhỏ hệ số trái tim khi màn hình nhỏ (như điện thoại)
            // Đảm bảo toàn bộ chiều ngang và chiều dọc của trái tim hiển thị trọn vẹn
            heartScaleBase = Math.min(width / 32, height / 36);
            recalculateBasePositions();
        }

        // Phương trình toán học tham số đường cong hình trái tim
        function heartFunction(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: x * scale,
                y: y * scale
            };
        }

        // Bảng màu hồng đỏ pha lê phát quang
        const colorPalette = [
            'rgba(255, 30, 85, ',
            'rgba(255, 75, 135, ',
            'rgba(255, 10, 95, ',
            'rgba(255, 180, 210, ',
            'rgba(255, 110, 160, '
        ];

        const CORE_PARTICLES = 7500;
        const HALO_PARTICLES = 1200;
        const corePoints = [];
        const haloPoints = [];

        // 1. Khởi tạo dữ liệu hạt lõi trái tim
        for (let i = 0; i < CORE_PARTICLES; i++) {
            const t = Math.PI * 2 * Math.random();
            const shrink = Math.pow(Math.random(), 0.4);

            corePoints.push({
                t: t,
                shrink: shrink,
                baseX: 0,
                baseY: 0,
                x: 0,
                y: 0,
                size: Math.random() * 0.5 + 0.25,
                color: colorPalette[Math.floor(Math.random() * colorPalette.length)],
                alpha: Math.random() * 0.7 + 0.3,
                jitterSpeed: Math.random() * 4 + 3.5,
                jitterRadius: Math.random() * 2.5 + 1.2
            });
        }

        // 2. Khởi tạo dữ liệu hạt hào quang ngoài
        for (let i = 0; i < HALO_PARTICLES; i++) {
            const t = Math.PI * 2 * Math.random();
            const spread = 1.04 + Math.random() * 0.65;

            haloPoints.push({
                t: t,
                spread: spread,
                x: 0,
                y: 0,
                vx: (Math.random() - 0.5) * 1.4,
                vy: (Math.random() - 0.5) * 1.4,
                size: Math.random() * 0.35 + 0.2,
                color: colorPalette[Math.floor(Math.random() * colorPalette.length)],
                alpha: Math.random() * 0.6 + 0.2,
                life: Math.random() * 50,
                maxLife: 45 + Math.random() * 45
            });
        }

        // Cập nhật lại tọa độ gốc mỗi khi kích thước màn hình thay đổi (xoay ngang/dọc)
        function recalculateBasePositions() {
            for (let i = 0; i < CORE_PARTICLES; i++) {
                const p = corePoints[i];
                const basePos = heartFunction(p.t, heartScaleBase);
                p.baseX = basePos.x * p.shrink;
                p.baseY = basePos.y * p.shrink;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        let tiltX = 0, tiltY = 0;
        let clickImpulse = 0;

        // Bắt sự kiện chạm trên màn hình điện thoại hoặc nhấp chuột máy tính
        window.addEventListener('pointerdown', (e) => {
            clickImpulse = 0.6; // Đập phồng mạnh khi chạm
        }, { passive: true });

        window.addEventListener('pointermove', (e) => {
            tiltX = (e.clientX - centerX) * 0.035;
            tiltY = (e.clientY - centerY) * 0.035;
        }, { passive: true });

        // Hàm tính chu kỳ nhịp tim tự nhiên tốc độ cao (0.95s)
        function getHeartBeatRatio(time) {
            const cycle = (time % 0.95) / 0.95;
            let beat = 0;
            if (cycle < 0.14) {
                beat = -Math.sin((cycle / 0.14) * Math.PI) * 0.06;
            } else if (cycle >= 0.14 && cycle < 0.34) {
                const progress = (cycle - 0.14) / 0.2;
                beat = Math.sin(progress * Math.PI) * 0.28;
            } else if (cycle >= 0.34 && cycle < 0.52) {
                const progress = (cycle - 0.34) / 0.18;
                beat = Math.sin(progress * Math.PI) * 0.12;
            }
            return beat;
        }

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.024;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(2, 1, 4, 0.25)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';

            clickImpulse *= 0.91;
            const naturalBeat = getHeartBeatRatio(time);
            const totalImpulse = Math.max(0, naturalBeat + clickImpulse);
            const scale = 1 + naturalBeat + clickImpulse;

            // Hào quang tâm tim tự co giãn theo kích thước màn hình
            const glowRadius = Math.min(width, height) * 0.35 * scale;
            const coreGlow = ctx.createRadialGradient(
                centerX + tiltX, centerY + tiltY, 5,
                centerX, centerY, glowRadius
            );
            coreGlow.addColorStop(0, `rgba(255, 30, 85, ${0.16 + totalImpulse * 0.22})`);
            coreGlow.addColorStop(0.55, `rgba(200, 15, 70, 0.03)`);
            coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, glowRadius * 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Cập nhật và kết xuất hạt thân tim
            for (let i = 0; i < corePoints.length; i++) {
                const p = corePoints[i];
                const jitterAngle = time * p.jitterSpeed + i;
                const jx = Math.cos(jitterAngle) * p.jitterRadius;
                const jy = Math.sin(jitterAngle) * p.jitterRadius;

                p.x = centerX + p.baseX * scale + jx + tiltX * 0.25;
                p.y = centerY + p.baseY * scale + jy + tiltY * 0.25;

                const dynamicAlpha = Math.min(1, p.alpha * (0.8 + totalImpulse * 1.3));
                ctx.fillStyle = p.color + dynamicAlpha + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Cập nhật và vẽ hạt hào quang bay ngoài
            for (let i = 0; i < haloPoints.length; i++) {
                const hp = haloPoints[i];
                hp.life++;

                if (hp.life >= hp.maxLife) {
                    hp.life = 0;
                    const basePos = heartFunction(hp.t, heartScaleBase);
                    hp.x = basePos.x * hp.spread;
                    hp.y = basePos.y * hp.spread;
                    hp.vx = (Math.random() - 0.5) * 1.4;
                    hp.vy = (Math.random() - 0.5) * 1.4;
                }

                hp.x += hp.vx * (1 + totalImpulse * 1.3);
                hp.y += hp.vy * (1 + totalImpulse * 1.3);

                const progress = hp.life / hp.maxLife;
                const fade = Math.sin(progress * Math.PI) * hp.alpha;
                const drawX = centerX + hp.x * scale + tiltX * 0.15;
                const drawY = centerY + hp.y * scale + tiltY * 0.15;

                ctx.fillStyle = hp.color + fade + ')';
                ctx.beginPath();
                ctx.arc(drawX, drawY, hp.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        animate();
    </script>
</body>
</html>
